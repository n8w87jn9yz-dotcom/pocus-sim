<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1016">
<title>POCUS-Schallkopf</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="probe">
<header class="probe-head">
  <span>Schallkopf</span>
  <span class="status" id="status">Nicht verbunden</span>
</header>

<section id="pairBox" class="card">
  <p>Code vom Laptop eingeben:</p>
  <form id="pairForm" class="pair-form">
    <input id="codeInput" autocomplete="off" autocapitalize="none" maxlength="6" placeholder="z. B. a1b2c3">
    <button>Verbinden</button>
  </form>
</section>

<p class="small center" id="tagNote" hidden></p>

<!-- Unterkante des Bildschirms = Schallkopffläche, Punkt = Markerseite. Antippen wechselt den Schallkopf. -->
<svg id="probeView" class="probe-view" viewBox="0 0 200 260" role="button" aria-label="Schallkopf wechseln">
  <path id="probeShape" fill="#1a2532" stroke="#4fb3ff" stroke-width="3"/>
  <circle id="probeMarker" r="7" fill="#4fb3ff"/>
</svg>
<p class="probe-name" id="probeName">–</p>

<button id="calibBtn" class="huge">Kalibrieren</button>

<p class="small center">Handy hochkant halten: Unterkante = Schallkopffläche, Bildschirm zu dir, linke Kante = Markerseite. Fenster, Tiefe und Befunde stellst du am Rechner ein. Schallkopf wechseln: Bild antippen.</p>

<script src="vendor/peerjs.min.js"></script>
<script type="module" src="js/probe.js"></script>
</body>
</html>
